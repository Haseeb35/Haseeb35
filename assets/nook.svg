  <g transform="translate(140.0,212)"><rect width="92.4" height="28" rx="14" fill="#EAB308" fill-opacity="0.13" stroke="#EAB308" stroke-opacity="0.35"/><text x="46.2" y="18.5" text-anchor="middle" font-size="13" font-weight="600" fill="#FDE68A">Web Audio</text></g>
