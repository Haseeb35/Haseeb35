<svg xmlns="http://www.w3.org/2000/svg" width="540" height="270" viewBox="0 0 540 270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Nook — A Pomodoro timer you sit inside. Touch the rain, the mug and the stove to mix real CC0 sounds while the desk clock keeps time. Works offline.</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0F1729"/><stop offset="1" stop-color="#0A101E"/></linearGradient>
    <radialGradient id="glow" cx="1" cy="0" r="0.9"><stop offset="0" stop-color="#EAB308" stop-opacity="0.32"/><stop offset="1" stop-color="#EAB308" stop-opacity="0"/></radialGradient>
    <linearGradient id="icon" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#EAB308"/><stop offset="1" stop-color="#F97316"/></linearGradient>
    <clipPath id="c"><rect width="540" height="270" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="540" height="270" fill="url(#bg)"/>
    <rect width="540" height="270" fill="url(#glow)"/>
  </g>
  <rect x="0.5" y="0.5" width="539" height="269" rx="20" fill="none" stroke="#FFFFFF" stroke-opacity="0.09"/>
  <rect x="32" y="30" width="48" height="48" rx="13" fill="url(#icon)"/>
  <g transform="translate(44,42)" fill="none" stroke="#FFFFFF" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" color="#FFFFFF"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M12 4v16M4 12h16"/></g>
  <text x="96" y="52" font-size="23" font-weight="750" letter-spacing="-0.4" fill="#F4F6FB">Nook</text>
