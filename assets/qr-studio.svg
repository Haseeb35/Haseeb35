<svg xmlns="http://www.w3.org/2000/svg" width="540" height="270" viewBox="0 0 540 270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>QR Studio — Make a QR code in under a minute for a link, WhatsApp, Wi-Fi or a contact. Every code is tested to scan, and nothing you type leaves your browser.</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0F1729"/><stop offset="1" stop-color="#0A101E"/></linearGradient>
    <radialGradient id="glow" cx="1" cy="0" r="0.9"><stop offset="0" stop-color="#D946EF" stop-opacity="0.32"/><stop offset="1" stop-color="#D946EF" stop-opacity="0"/></radialGradient>
    <linearGradient id="icon" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#D946EF"/><stop offset="1" stop-color="#6366F1"/></linearGradient>
    <clipPath id="c"><rect width="540" height="270" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="540" height="270" fill="url(#bg)"/>
    <rect width="540" height="270" fill="url(#glow)"/>
  </g>
  <rect x="0.5" y="0.5" width="539" height="269" rx="20" fill="none" stroke="#FFFFFF" stroke-opacity="0.09"/>
  <rect x="32" y="30" width="48" height="48" rx="13" fill="url(#icon)"/>
  <g transform="translate(44,42)" fill="none" stroke="#FFFFFF" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" color="#FFFFFF"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><path d="M14 14h2v2M18 14h2M14 18v2h2M18 18h2v2" /></g>
  <text x="96" y="52" font-size="23" font-weight="750" letter-spacing="-0.4" fill="#F4F6FB">QR Studio</text>
  <text x="96" y="73" font-size="13.5" font-weight="500" fill="#7D8AA3">QR code maker &amp; checker</text>
  <g transform="translate(393.0,36)">
    <rect width="115.0" height="28" rx="14" fill="#94A3B8" fill-opacity="0.12" stroke="#94A3B8" stroke-opacity="0.35"/>
    <circle cx="15" cy="14" r="4" fill="#94A3B8"/>
    <text x="26" y="18.5" font-size="12.5" font-weight="650" fill="#CBD5E1">Open source</text>
  </g>
  <text x="32" y="120" font-size="17" fill="#AAB5C8">Make a QR code in under a minute for a link,</text>
  <text x="32" y="146" font-size="17" fill="#AAB5C8">WhatsApp, Wi-Fi or a contact. Every code is tested</text>
  <text x="32" y="172" font-size="17" fill="#AAB5C8">to scan, and nothing you type leaves your browser.</text>
  <g transform="translate(32.0,212)"><rect width="100.0" height="28" rx="14" fill="#D946EF" fill-opacity="0.13" stroke="#D946EF" stroke-opacity="0.35"/><text x="50.0" y="18.5" text-anchor="middle" font-size="13" font-weight="600" fill="#F5D0FE">JavaScript</text></g>
  <g transform="translate(140.0,212)"><rect width="69.6" height="28" rx="14" fill="#D946EF" fill-opacity="0.13" stroke="#D946EF" stroke-opacity="0.35"/><text x="34.8" y="18.5" text-anchor="middle" font-size="13" font-weight="600" fill="#F5D0FE">Canvas</text></g>
  <g transform="translate(217.6,212)"><rect width="46.8" height="28" rx="14" fill="#D946EF" fill-opacity="0.13" stroke="#D946EF" stroke-opacity="0.35"/><text x="23.4" y="18.5" text-anchor="middle" font-size="13" font-weight="600" fill="#F5D0FE">PWA</text></g>
  <g transform="translate(272.4,212)"><rect width="122.8" height="28" rx="14" fill="#D946EF" fill-opacity="0.13" stroke="#D946EF" stroke-opacity="0.35"/><text x="61.4" y="18.5" text-anchor="middle" font-size="13" font-weight="600" fill="#F5D0FE">Privacy-first</text></g>
</svg>
